<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #f5ecdc;
            /* very light tan */
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .message {
            color: #b8934f;
            /* more saturated tan */
            font-size: 1.5rem;
            text-align: center;
            max-width: 600px;
            padding: 0 20px;
            line-height: 1.6;
        }

        a {
            color: #b8934f;
            text-decoration: underline;
        }

        a:hover {
            color: #9c7a3d;
        }
    </style>
</head>

<body>
    <div class="message">
        Hello, my website is currently under construction.<br>If you're a recruiter, you can find my resume <a href="https://www.google.com/search" target="_blank"
            rel="noopener noreferrer">here</a>.
    </div>
</body>

</html>
